apiVersion: primehub.io/v1alpha1
kind: PhAppTemplate
metadata:
  name: ollama
  namespace: hub
spec:
  name: Ollama
  version: v060
  description: Ollama makes it easy to get up and running with large language models locally.
  docLink: https://github.com/ollama/ollama/releases
  icon: data:image/png;base64,
  defaultEnvs:
  - name: OLLAMA_MODELS 
    description: "The path to the models directory"
    defaultValue: "$(PRIMEHUB_APP_ROOT)/ollama_models"
    optional: false
  - name: OLLAMA_HOST
    description: "IP Address for the ollama server"
    defaultValue: "0.0.0.0:11434"
    optional: false
  template:
    spec:
      podTemplate:
        spec:
          containers:
          - name: ollama-v060
            image: docker.io/ollama/ollama:latest
            ports:
            - containerPort: 11434
              name: ollama
              protocol: TCP
      svcTemplate:
        spec:
          ports:
            - name: ollama
              port: 11434
              protocol: TCP
              targetPort: 11434
      httpPort: 11434
      rewrite: true
