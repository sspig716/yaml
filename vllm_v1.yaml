apiVersion: primehub.io/v1alpha1
kind: PhAppTemplate
metadata:
  name: vllm-soc
  namespace: hub
spec:
  name: vLLM-soc3
  version: soc
  description: vLLM is a high-throughput and memory-efficient serving engine for LLMs.
  docLink: https://github.com/vllm-project/vllm
  icon: data:image/png;base64, 
  defaultEnvs:
  - name: HUGGING_FACE_HUB_TOKEN
    description: "Hugging Face API Token (Required for gated/private models like Llama 3)"
    defaultValue: ""
    optional: true
  - name: VLLM_MODEL
    description: "Hugging Face model name or local path"
    defaultValue: "meta-llama/Meta-Llama-3-8B-Instruct"
    optional: false
  - name: GPU_MEMORY_UTILIZATION
    description: "The fraction of GPU memory to be used for the model (0.0 - 1.0)"
    defaultValue: "0.90"
    optional: false
  template:
    spec:
      podTemplate:
        spec:
          containers:
          - name: vllm-soc3
            image: docker.io/vllm/vllm-openai:latest
            ports:
            - containerPort: 8000
              name: vllm-soc3
              protocol: TCP
            command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
            args:
            - "--model"
            - "$(VLLM_MODEL)"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "$(GPU_MEMORY_UTILIZATION)"
            - "--trust-remote-code"
            volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: model-cache
          volumes:
          - name: model-cache
            hostPath:
              path: $(PRIMEHUB_APP_ROOT)/huggingface_cache
              type: DirectoryOrCreate
      svcTemplate:
        spec:
          ports:
            - name: vllm-soc3
              port: 8000
              protocol: TCP
              targetPort: 8000
      httpPort: 8000
      rewrite: true
