apiVersion: primehub.io/v1alpha1
kind: PhAppTemplate

metadata:
  name: vllm-openai-server
  namespace: hub

spec:

  name: vLLM OpenAI Server

  version: v0.10.2

  description: >
    vLLM high performance LLM inference server with OpenAI compatible API.
    Supports HuggingFace models, tensor parallelism and GPU acceleration.

  docLink: https://docs.vllm.ai/

  icon: data:image/svg+xml;base64,PHN2ZyB4bWxucz0i...

  defaultEnvs:

  - name: MODEL_NAME
    description: HuggingFace model path
    defaultValue: "Qwen/Qwen3-8B"
    optional: false


  - name: GPU_MEMORY_UTILIZATION
    description: GPU memory utilization ratio
    defaultValue: "0.90"
    optional: false


  - name: MAX_MODEL_LEN
    description: Maximum context length
    defaultValue: "32768"
    optional: false


  - name: TENSOR_PARALLEL_SIZE
    description: Tensor parallel GPU count
    defaultValue: "1"
    optional: false


  - name: DTYPE
    description: Model precision
    defaultValue: "auto"
    optional: true


  - name: HF_TOKEN
    description: HuggingFace access token
    defaultValue: ""
    optional: true


  template:

    spec:

      podTemplate:

        spec:

          containers:

          - name: vllm

            image: vllm/vllm-openai:v0.10.2

            command:

            - python

            - -m

            - vllm.entrypoints.openai.api_server


            args:

            - --model
            - $(MODEL_NAME)

            - --host
            - 0.0.0.0

            - --port
            - "8000"

            - --gpu-memory-utilization
            - $(GPU_MEMORY_UTILIZATION)

            - --max-model-len
            - $(MAX_MODEL_LEN)

            - --tensor-parallel-size
            - $(TENSOR_PARALLEL_SIZE)

            - --dtype
            - $(DTYPE)


            env:


            - name: HUGGING_FACE_HUB_TOKEN

              value: "$(HF_TOKEN)"


            - name: HF_HOME

              value: "$(PRIMEHUB_APP_ROOT)/huggingface"


            - name: TRANSFORMERS_CACHE

              value: "$(PRIMEHUB_APP_ROOT)/huggingface"


            ports:

            - containerPort: 8000

              name: http

              protocol: TCP



            resources:

              limits:

                nvidia.com/gpu: 1



      restartPolicy: Always



      svcTemplate:

        spec:

          ports:

          - name: http

            port: 8000

            protocol: TCP

            targetPort: 8000



      httpPort: 8000
